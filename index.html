.foto::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(to bottom,transparent,var(--crema))}
.cuerpo{padding-inline:20px;padding-block:4px 36px;display:flex;flex-direction:column;gap:22px}
header{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.marca{font-weight:700;font-size:.8rem;letter-spacing:.32em;text-transform:uppercase;color:var(--madera);margin:0}
h1{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1.15;margin:0;text-wrap:balance}
.ola{width:92px;height:14px;color:var(--mar);margin-top:6px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--mar);outline-offset:3px}
.todo{background:var(--espresso);color:var(--papel);font-weight:600;font-size:1.1rem;padding:18px 20px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 24px -12px var(--espresso);transition:transform .12s,background .2s}
.todo:active{transform:scale(.98)}
.todo.ok{background:var(--mar)}
.todo svg,.fila svg{width:1.15em;height:1.15em;flex:none}
.ayuda{text-align:center;color:var(--tenue);font-size:.9rem;margin:-10px 0 0}
dl{margin:0;background:var(--papel);border-radius:22px;padding:6px 18px;box-shadow:0 14px 30px -22px var(--espresso)}
.fila{width:100%;display:flex;align-items:center;gap:12px;padding:13px 0;text-align:left;border-bottom:1px solid var(--linea)}
.fila:last-child{border-bottom:0}
.fila span{flex:1;min-width:0;display:flex;flex-direction:column}
dt{font-size:.78rem;color:var(--tenue)}
dd{margin:0;font-weight:600;font-size:1.05rem;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.fila svg{color:var(--madera)}
.fila.ok svg{color:var(--mar)}
.nota{align-self:center;background:var(--madera);color:var(--papel);font-weight:500;padding:11px 22px;border-radius:999px;text-align:center;margin:0}
.aviso{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--mar);color:var(--papel);
  font-weight:600;padding:11px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
.aviso.ver{opacity:1;transform:translate(-50%,0)}
#manual{width:100%;box-sizing:border-box;font:inherit;color:var(--espresso);background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:12px;resize:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<main class="hoja">
  <div class="foto" role="img" aria-label="Café y canastita en una mesa frente a la playa"></div>
  <div class="cuerpo">
    <header>
      <p class="marca">La Canastita</p>
      <h1>Datos de transferencia</h1>
      <svg class="ola" viewBox="0 0 92 14" fill="none" aria-hidden="true"><path d="M2 7c7.5-6 15-6 22 0s14.5 6 22 0 14.5-6 22 0 14.5 6 22 0" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
    </header>

    <button class="todo" id="todo" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
      <span id="todoTxt">Copiar todos los datos</span>
    </button>
    <p class="ayuda">O toca un dato para copiar solo ese.</p>

    <dl id="lista"></dl>

    <textarea id="manual" rows="6" readonly hidden aria-label="Datos para copiar a mano"></textarea>

    <p class="nota">Muestra tu comprobante. ¡Gracias!</p>
  </div>
</main>
<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script>
const DATOS = [
  ["Nombre", "Maria Gajardo"],
  ["RUT", "16.574.876-K"],
  ["Banco", "Mercado Pago"],
  ["Tipo de cuenta", "Cuenta Vista"],
  ["N° de cuenta", "1068561432"],
  ["Correo", "silvanna.gajardo@gmail.com"]
];
const ICONO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
const lista = document.getElementById("lista"), aviso = document.getElementById("aviso"), manual = document.getElementById("manual");
let t;

function avisar(msg){ aviso.textContent = msg; aviso.classList.add("ver"); clearTimeout(t); t = setTimeout(() => aviso.classList.remove("ver"), 2200); }

async function copiar(texto){
  try { await navigator.clipboard.writeText(texto); return true; } catch (e) {}
  try {
    const ta = document.createElement("textarea"); ta.value = texto; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0"; document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, texto.length);
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  } catch (e) { return false; }
}

function sinCopia(texto){
  manual.value = texto; manual.hidden = false; manual.focus(); manual.select();
  avisar("Mantén presionado el texto y elige Copiar");
}

DATOS.forEach(([k, v]) => {
  const b = document.createElement("button"); b.type = "button"; b.className = "fila";
  b.setAttribute("aria-label", "Copiar " + k + ": " + v);
  b.innerHTML = "<span><dt></dt><dd></dd></span>" + ICONO;
  b.querySelector("dt").textContent = k; b.querySelector("dd").textContent = v;
  b.addEventListener("click", async () => {
    if (await copiar(v)) { b.classList.add("ok"); setTimeout(() => b.classList.remove("ok"), 1500); avisar(k + " copiado"); }
    else sinCopia(v);
  });
  lista.appendChild(b);
});

const todo = document.getElementById("todo"), todoTxt = document.getElementById("todoTxt");
todo.addEventListener("click", async () => {
  const texto = DATOS.map(d => d[1]).join("\n");
  if (await copiar(texto)) {
    todo.classList.add("ok"); todoTxt.textContent = "Datos copiados";
    avisar("Listo. Pégalos en la app de tu banco");
    setTimeout(() => { todo.classList.remove("ok"); todoTxt.textContent = "Copiar todos los datos"; }, 2500);
  } else sinCopia(texto);
});
</script>

</body>
</html>
